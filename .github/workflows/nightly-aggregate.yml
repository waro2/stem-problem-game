name: Nightly stats aggregation

# Refreshes student_domain_stats and problem_stats (src/server/jobs/aggregateStats.ts)
# from completed sessions — this is what feeds the "Taux de complétion par domaine"
# chart on the Research Dashboard. Nothing in this repo triggers that job
# automatically otherwise (see the comment in runNightlyAggregation.ts).
#
# Requires a repository secret DATABASE_URL pointing at the production database
# (the same one the Railway-deployed server uses). Add it under
# Settings → Secrets and variables → Actions before this workflow can succeed.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run jobs:aggregate
