<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 800 450" role="img">
<title>Défi STEM — fond gameplay (résolution de problème)</title>

<defs>
  <!-- Fond : vert très sombre, légèrement plus lumineux sur les bords haut et gauche -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#0F2E1C"/>
    <stop offset="45%"  stop-color="#091A10"/>
    <stop offset="100%" stop-color="#060E08"/>
  </linearGradient>

  <!-- Halo vert doux -->
  <radialGradient id="gh-green" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#2EC97B" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#2EC97B" stop-opacity="0"/>
  </radialGradient>
  <!-- Halo doré -->
  <radialGradient id="gh-gold" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </radialGradient>
  <!-- Halo rouge -->
  <radialGradient id="gh-red" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#E05555" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#E05555" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ══════════════════════════════════════════════════════════════════════
     FOND DE BASE
════════════════════════════════════════════════════════════════════════ -->
<rect width="800" height="450" fill="url(#bg)"/>

<!-- Légère vignette sur les 4 bords -->
<rect x="0"   y="0"   width="80"  height="450" fill="#060E08" opacity="0.40"/>
<rect x="720" y="0"   width="80"  height="450" fill="#060E08" opacity="0.35"/>
<rect x="0"   y="0"   width="800" height="55"  fill="#060E08" opacity="0.30"/>
<rect x="0"   y="400" width="800" height="50"  fill="#060E08" opacity="0.35"/>

<!-- ══════════════════════════════════════════════════════════════════════
     GRILLE DE COORDONNÉES (papier millimétré scientifique, très subtil)
     Lignes verticales : toutes les 50 unités
     Lignes horizontales : toutes les 50 unités
════════════════════════════════════════════════════════════════════════ -->
<!-- Verticales -->
<line x1="50"  y1="0" x2="50"  y2="450" stroke="#163528" stroke-width="0.4" opacity="0.50"/>
<line x1="100" y1="0" x2="100" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.40"/>
<line x1="150" y1="0" x2="150" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.35"/>
<line x1="200" y1="0" x2="200" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.30"/>
<line x1="250" y1="0" x2="250" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.28"/>
<line x1="300" y1="0" x2="300" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.25"/>
<line x1="350" y1="0" x2="350" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.25"/>
<line x1="400" y1="0" x2="400" y2="450" stroke="#163528" stroke-width="0.5" opacity="0.32"/>
<line x1="450" y1="0" x2="450" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.25"/>
<line x1="500" y1="0" x2="500" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.25"/>
<line x1="550" y1="0" x2="550" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.28"/>
<line x1="600" y1="0" x2="600" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.30"/>
<line x1="650" y1="0" x2="650" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.35"/>
<line x1="700" y1="0" x2="700" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.40"/>
<line x1="750" y1="0" x2="750" y2="450" stroke="#163528" stroke-width="0.4" opacity="0.48"/>
<!-- Horizontales -->
<line x1="0" y1="50"  x2="800" y2="50"  stroke="#163528" stroke-width="0.4" opacity="0.45"/>
<line x1="0" y1="100" x2="800" y2="100" stroke="#163528" stroke-width="0.4" opacity="0.35"/>
<line x1="0" y1="150" x2="800" y2="150" stroke="#163528" stroke-width="0.4" opacity="0.30"/>
<line x1="0" y1="200" x2="800" y2="200" stroke="#163528" stroke-width="0.4" opacity="0.28"/>
<line x1="0" y1="225" x2="800" y2="225" stroke="#163528" stroke-width="0.5" opacity="0.30"/>
<line x1="0" y1="250" x2="800" y2="250" stroke="#163528" stroke-width="0.4" opacity="0.28"/>
<line x1="0" y1="300" x2="800" y2="300" stroke="#163528" stroke-width="0.4" opacity="0.30"/>
<line x1="0" y1="350" x2="800" y2="350" stroke="#163528" stroke-width="0.4" opacity="0.35"/>
<line x1="0" y1="400" x2="800" y2="400" stroke="#163528" stroke-width="0.4" opacity="0.42"/>

<!-- Points aux intersections (petits, très discrets) -->
<circle cx="50"  cy="100" r="1.2" fill="#2A6040" opacity="0.40"/>
<circle cx="50"  cy="200" r="1.2" fill="#2A6040" opacity="0.35"/>
<circle cx="50"  cy="300" r="1.2" fill="#2A6040" opacity="0.38"/>
<circle cx="50"  cy="400" r="1.2" fill="#2A6040" opacity="0.35"/>
<circle cx="150" cy="50"  r="1.2" fill="#2A6040" opacity="0.30"/>
<circle cx="150" cy="150" r="1.2" fill="#2A6040" opacity="0.25"/>
<circle cx="150" cy="350" r="1.2" fill="#2A6040" opacity="0.25"/>
<circle cx="150" cy="400" r="1.2" fill="#2A6040" opacity="0.28"/>
<circle cx="400" cy="50"  r="1.5" fill="#2A6040" opacity="0.30"/>
<circle cx="400" cy="400" r="1.5" fill="#2A6040" opacity="0.30"/>
<circle cx="650" cy="100" r="1.2" fill="#2A6040" opacity="0.30"/>
<circle cx="650" cy="200" r="1.2" fill="#2A6040" opacity="0.25"/>
<circle cx="650" cy="350" r="1.2" fill="#2A6040" opacity="0.28"/>
<circle cx="650" cy="400" r="1.2" fill="#2A6040" opacity="0.30"/>
<circle cx="750" cy="100" r="1.2" fill="#2A6040" opacity="0.35"/>
<circle cx="750" cy="200" r="1.2" fill="#2A6040" opacity="0.30"/>
<circle cx="750" cy="300" r="1.2" fill="#2A6040" opacity="0.33"/>
<circle cx="750" cy="400" r="1.2" fill="#2A6040" opacity="0.35"/>

<!-- ══════════════════════════════════════════════════════════════════════
     HALOS D'AMBIANCE (sources lumineuses douces dans les marges)
════════════════════════════════════════════════════════════════════════ -->
<!-- Halo vert bord gauche (zone Variables) -->
<circle cx="35"  cy="240" r="160" fill="url(#gh-green)" opacity="0.75"/>
<!-- Halo doré bord droit (zone Progression) -->
<circle cx="768" cy="200" r="140" fill="url(#gh-gold)"  opacity="0.70"/>
<!-- Halo rouge bas-centre (objectif) -->
<circle cx="400" cy="430" r="120" fill="url(#gh-red)"   opacity="0.65"/>
<!-- Halo vert haut-centre (formules actives) -->
<circle cx="400" cy="25"  r="100" fill="url(#gh-green)" opacity="0.55"/>

<!-- ══════════════════════════════════════════════════════════════════════
     NŒUDS DÉCORATIFS DANS LES MARGES
     (petits, concentrés sur les bords visibles hors panneaux)
════════════════════════════════════════════════════════════════════════ -->

<!-- ─── Bord gauche (marge visible à gauche du panneau Variables) ──────── -->
<!-- Nœud v (connue, vert) -->
<circle cx="28" cy="130" r="14" fill="#0D3520" stroke="#3EC988" stroke-width="1.6"/>
<text x="28" y="131" style="font-family:monospace;font-size:10px;fill:#fff;
      text-anchor:middle;dominant-baseline:middle;font-weight:bold">v</text>
<circle cx="28" cy="130" r="22" fill="none" stroke="#3EC988" stroke-width="0.5" opacity="0.25"/>

<!-- Nœud t (connue, vert) -->
<circle cx="28" cy="290" r="14" fill="#0D3520" stroke="#3EC988" stroke-width="1.6"/>
<text x="28" y="291" style="font-family:monospace;font-size:10px;fill:#fff;
      text-anchor:middle;dominant-baseline:middle;font-weight:bold">t</text>
<circle cx="28" cy="290" r="22" fill="none" stroke="#3EC988" stroke-width="0.5" opacity="0.22"/>

<!-- Connexion v → t (bord gauche) -->
<line x1="28" y1="144" x2="28" y2="276"
      stroke="#2A7048" stroke-width="0.8" opacity="0.40" stroke-dasharray="4,3"/>

<!-- Formule discrète bord gauche -->
<text x="44" y="212"
      style="font-family:monospace;font-size:7px;fill:#1A5030;
             text-anchor:start;opacity:0.55;transform:rotate(-90deg);
             writing-mode:vertical-lr">d = v · t</text>

<!-- ─── Bord droit (marge visible à droite du panneau Progression) ──────── -->
<!-- Nœud F (connue, vert) -->
<circle cx="773" cy="140" r="14" fill="#0D3520" stroke="#3EC988" stroke-width="1.6"/>
<text x="773" y="141" style="font-family:monospace;font-size:10px;fill:#fff;
      text-anchor:middle;dominant-baseline:middle;font-weight:bold">F</text>
<circle cx="773" cy="140" r="22" fill="none" stroke="#3EC988" stroke-width="0.5" opacity="0.22"/>

<!-- Nœud m (connue, vert) -->
<circle cx="773" cy="230" r="14" fill="#0D3520" stroke="#3EC988" stroke-width="1.6"/>
<text x="773" y="231" style="font-family:monospace;font-size:10px;fill:#fff;
      text-anchor:middle;dominant-baseline:middle;font-weight:bold">m</text>
<circle cx="773" cy="230" r="22" fill="none" stroke="#3EC988" stroke-width="0.5" opacity="0.22"/>

<!-- Nœud objectif (rouge, bord droit bas) -->
<circle cx="773" cy="340" r="14" fill="#2A0A0A" stroke="#E05555" stroke-width="1.6"/>
<text x="773" y="341" style="font-family:monospace;font-size:10px;fill:#fff;
      text-anchor:middle;dominant-baseline:middle;font-weight:bold">a</text>
<circle cx="773" cy="340" r="22" fill="none" stroke="#E05555" stroke-width="0.5" opacity="0.22"/>
<circle cx="773" cy="340" r="30" fill="none" stroke="#E05555" stroke-width="0.3" opacity="0.10"/>

<!-- Connexions bord droit -->
<line x1="773" y1="154" x2="773" y2="216"
      stroke="#2A7048" stroke-width="0.8" opacity="0.38" stroke-dasharray="4,3"/>
<path d="M773,244 C773,270 773,300 773,326"
      fill="none" stroke="#F5A623" stroke-width="0.9" opacity="0.45" stroke-dasharray="5,3"/>

<!-- ─── Bas de page (visible sous les panneaux) ─────────────────────────── -->
<!-- Chemin de formule F=m·a en cours d'activation (doré) -->
<path d="M120,428 C250,418 380,422 520,418 C600,415 670,420 730,428"
      fill="none" stroke="#F5A623" stroke-width="1.0" opacity="0.30" stroke-dasharray="6,4"/>

<!-- Formule centrale bas -->
<text x="400" y="432"
      style="font-family:monospace;font-size:8px;fill:#1C4A2A;
             text-anchor:middle;opacity:0.45">F · s = F · e − 1  •  condition d'activation SPA</text>

<!-- Quelques points lumineux sur la ligne bas -->
<circle cx="200" cy="428" r="2"   fill="#2A7048" opacity="0.50"/>
<circle cx="350" cy="423" r="1.5" fill="#F5A623" opacity="0.45"/>
<circle cx="400" cy="422" r="2.5" fill="#F5A623" opacity="0.35"/>
<circle cx="450" cy="423" r="1.5" fill="#F5A623" opacity="0.45"/>
<circle cx="600" cy="419" r="2"   fill="#2A7048" opacity="0.45"/>

<!-- ─── Haut de page (visible au-dessus des panneaux, sous la nav) ──────── -->
<!-- Ligne de scan horizontale (effet "interface active") -->
<line x1="80" y1="76" x2="720" y2="76"
      stroke="#1A4A28" stroke-width="0.6" opacity="0.55"/>
<!-- Points sur la ligne de scan -->
<circle cx="120" cy="76" r="1.5" fill="#2A7048" opacity="0.50"/>
<circle cx="280" cy="76" r="1.5" fill="#2A7048" opacity="0.40"/>
<circle cx="400" cy="76" r="2"   fill="#3EC988" opacity="0.35"/>
<circle cx="520" cy="76" r="1.5" fill="#2A7048" opacity="0.40"/>
<circle cx="680" cy="76" r="1.5" fill="#2A7048" opacity="0.50"/>

<!-- Petit indicateur "Algorithme SPA actif" (haut-gauche, discret) -->
<rect x="80" y="83" width="120" height="16" rx="3"
      fill="#0C2A16" stroke="#1A4828" stroke-width="0.5" opacity="0.70"/>
<circle cx="90" cy="91" r="3" fill="#3EC988" opacity="0.80"/>
<text x="98" y="95"
      style="font-size:6.5px;fill:#2A7048;opacity:0.80">Algorithme SPA  actif</text>

<!-- rho : efficacité (haut-droit, discret) -->
<rect x="600" y="83" width="120" height="16" rx="3"
      fill="#0C2A16" stroke="#1A4828" stroke-width="0.5" opacity="0.70"/>
<text x="660" y="95"
      style="font-family:monospace;font-size:6.5px;fill:#2A7048;
             text-anchor:middle;opacity:0.80">ρ = opt / total</text>

<!-- ── Marque ────────────────────────────────────────────────────────── -->
<text x="400" y="445"
      style="font-size:7px;fill:#0D2418;text-anchor:middle;
             letter-spacing:4px;font-weight:bold;opacity:0.45">DÉFI STEM</text>
</svg>
